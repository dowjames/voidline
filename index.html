<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDLINE — Orbital Interception</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #gl { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #7fe7ff; z-index: 20;
    font: 300 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em;
    background: radial-gradient(ellipse at 50% 45%, #061019 0%, #01030a 70%);
    transition: opacity .8s ease; text-transform: uppercase;
  }
  #boot .bar { width: 260px; height: 1px; background: #123244; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 30%; background: #7fe7ff; animation: sweep 1.1s infinite ease-in-out; }
  @keyframes sweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(330%)} }
  #boot .hint { color: #4a7d94; font-size: 11px; letter-spacing: .22em; }
  #boot.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="boot">
  <div>Initialising flight systems</div>
  <div class="bar"><i></i></div>
  <div class="hint">Click to capture controls &nbsp;·&nbsp; WASD fly &nbsp;·&nbsp; Space fire &nbsp;·&nbsp; X dampeners &nbsp;·&nbsp; P autopilot &nbsp;·&nbsp; H hide hud</div>
</div>
<script src="./dist/game.js"></script>
<script>
  // hide the boot veil once the first frames are on screen
  setTimeout(() => document.getElementById('boot').classList.add('hidden'), 900);
</script>
</body>
</html>
